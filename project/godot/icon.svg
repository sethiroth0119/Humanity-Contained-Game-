<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#1a1a2e"/>
  <!-- Skull -->
  <ellipse cx="64" cy="52" rx="22" ry="20" fill="#c8b89a"/>
  <rect x="48" y="62" width="32" height="14" rx="3" fill="#c8b89a"/>
  <!-- Eye sockets -->
  <ellipse cx="56" cy="50" rx="6" ry="7" fill="#1a1a2e"/>
  <ellipse cx="72" cy="50" rx="6" ry="7" fill="#1a1a2e"/>
  <!-- Glowing eyes -->
  <ellipse cx="56" cy="50" rx="3" ry="3.5" fill="#7744cc"/>
  <ellipse cx="72" cy="50" rx="3" ry="3.5" fill="#7744cc"/>
  <!-- Jaw teeth -->
  <rect x="52" y="72" width="5" height="6" rx="1" fill="#1a1a2e"/>
  <rect x="61" y="72" width="6" height="6" rx="1" fill="#1a1a2e"/>
  <rect x="71" y="72" width="5" height="6" rx="1" fill="#1a1a2e"/>
  <!-- Sword behind skull -->
  <rect x="62" y="8" width="4" height="78" rx="1" fill="#8899aa" opacity="0.9"/>
  <!-- Crossguard -->
  <rect x="46" y="40" width="36" height="5" rx="2" fill="#aa8844"/>
  <!-- Sword pommel -->
  <ellipse cx="64" cy="90" rx="5" ry="4" fill="#aa8844"/>
</svg>
